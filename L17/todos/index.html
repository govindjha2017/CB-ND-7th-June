<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/55b4e8a4a8.js"></script>
</head>
<body>

    <div class="container">
        <div class="input">
            <input id="inp" type="text" placeholder="Enter Here...">
            <button id="btn">Add todo</button>
        </div>

        <div class="todosList">
            <div class="todos">
                <div class="sectionA">
                    <input class="checkBox" type="checkbox">
                    <p>Cricket</p>
                </div>
                <div class="sectionB">
                    <span class="up-arrow">↑</span>
                    <span class="bin"><i class="fa-solid fa-trash-can"></i></span>
                    <span class="down-arrow">↓</span>
                </div>
            </div>

            
            

            
        </div>
    </div>
    

    <script src="./script.js"></script>
</body>
</html>
